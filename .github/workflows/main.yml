name: Android Native Build

on:
  workflow_dispatch: # Telefonda "Run workflow" butonunu aktif eder

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The app model (assets/*.onnx) is a normal git file. model/uyghur_asr_fp32.onnx is in Git LFS
      # and only needed for training, so LFS is not pulled here.
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify model is real (not an LFS pointer)
        run: |
          size=$(stat -c %s app/src/main/assets/uyghur_asr_int8.onnx)
          echo "model size: $size bytes"
          test "$size" -gt 1000000

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UyghurKeyboard-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Every build is also published as a Release: the APK can be downloaded directly on the phone
      # (Releases page → Assets), no zip and no login needed.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION-build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk UyghurKeyboard.apk
          PRE=""; [ "${{ github.ref_name }}" != "main" ] && PRE="--prerelease"
          gh release create "$TAG" UyghurKeyboard.apk --target "${{ github.sha }}" $PRE \
            --title "Uygurca Klavye $VERSION — derleme ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Branch: ${{ github.ref_name }}, commit ${{ github.sha }}. Telefonda UyghurKeyboard.apk dosyasını indirip kur."
