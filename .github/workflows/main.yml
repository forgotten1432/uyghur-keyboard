name: Android Native Build

on:
  workflow_dispatch: # Telefonda "Run workflow" butonunu aktif eder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The app model (assets/*.onnx) is a normal git file. model/uyghur_asr_fp32.onnx is in Git LFS
      # and only needed for training, so LFS is not pulled here.
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify model is real (not an LFS pointer)
        run: |
          size=$(stat -c %s app/src/main/assets/uyghur_asr_int8.onnx)
          echo "model size: $size bytes"
          test "$size" -gt 1000000

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UyghurKeyboard-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
