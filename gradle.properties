# gradle.properties — Global settings applied to every Gradle build in this project.

# Use AndroidX libraries instead of the legacy Android Support Library.
android.useAndroidX=true

# Non-transitive R classes: each module only sees its own resources in R.*,
# not resources from dependencies. Reduces build times and avoids name collisions.
android.nonTransitiveRClass=true

# Give the Gradle daemon more memory (helpful for Kotlin compilation).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle's configuration cache for faster re-builds.
org.gradle.configuration-cache=true
